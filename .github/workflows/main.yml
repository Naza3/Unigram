name: Build Unigram (Official Method)

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: windows-2022

    env:
      VCPKG_COMMIT: cff6ed45719c0162fa7065fdac90506a0add812c

    steps:

    ############################################
    # Checkout (NO recursive because VLC broken)
    ############################################

    - name: Checkout Unigram
      uses: actions/checkout@v4
      with:
        repository: UnigramDev/Unigram
        fetch-depth: 1
        submodules: false


    ############################################
    # Init submodules except VLC
    ############################################

    - name: Init Submodules
      run: |

        git submodule update --init Libraries/rlottie
        git submodule update --init Libraries/opus
        git submodule update --init Libraries/usrsctp
        git submodule update --init Libraries/tgcalls


    ############################################
    # Setup Visual Studio tools
    ############################################

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2


    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2


    ############################################
    # Create Telegram Constants
    ############################################

    - name: Create Constants.Secret.cs
      shell: powershell
      run: |

        mkdir Unigram\Telegram -Force

        @"
        namespace Telegram
        {
            public static partial class Constants
            {
                static Constants()
                {
                    ApiId = 123456;
                    ApiHash = "abcdef123456";
                    AppChannel = "ci";
                }
            }
        }
        "@ | Out-File Unigram\Telegram\Constants.Secret.cs -Encoding utf8


    ############################################
    # Setup vcpkg
    ############################################

    - name: Clone vcpkg
      run: git clone https://github.com/Microsoft/vcpkg.git


    - name: Bootstrap vcpkg
      shell: powershell
      run: |

        cd vcpkg

        git checkout $env:VCPKG_COMMIT

        .\bootstrap-vcpkg.bat


    ############################################
    # Apply vcpkg patch (official requirement)
    ############################################

    - name: Patch vcpkg
      shell: powershell
      run: |

        Copy-Item Libraries\vcpkg.patch vcpkg\ -Force

        cd vcpkg

        git apply vcpkg.patch


    ############################################
    # Install native dependencies
    ############################################

    - name: Install libraries
      run: |

        vcpkg\vcpkg.exe install ffmpeg[dav1d,opus,vpx]:x64-uwp
        vcpkg\vcpkg.exe install lz4:x64-uwp
        vcpkg\vcpkg.exe install openssl:x64-uwp
        vcpkg\vcpkg.exe install zlib:x64-uwp
        vcpkg\vcpkg.exe install libogg:x64-uwp
        vcpkg\vcpkg.exe install opus:x64-uwp
        vcpkg\vcpkg.exe install boost-regex:x64-uwp

        vcpkg\vcpkg.exe integrate install


    ############################################
    # Build LibVLC (OFFICIAL METHOD)
    ############################################

    - name: Install Docker
      run: |

        choco install docker-desktop -y


    - name: Start Docker
      run: |

        net start com.docker.service


    - name: Build LibVLC
      shell: powershell
      run: |

        cd Libraries\vlc

        powershell -ExecutionPolicy ByPass ./build.ps1 -arch x64


    ############################################
    # Restore NuGet
    ############################################

    - name: Restore NuGet
      run: nuget restore Telegram.sln


    ############################################
    # Build Solution
    ############################################

    - name: Build Unigram
      run: |

        msbuild Telegram.sln ^
        /p:Configuration=Release ^
        /p:Platform=x64 ^
        /m


    ############################################
    # Package MSIX
    ############################################

    - name: Package MSIX
      run: |

        msbuild Telegram.Msix/Telegram.Msix.wapproj ^
        /p:Configuration=Release ^
        /p:Platform=x64


    ############################################
    # Upload Artifact
    ############################################

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Unigram-MSIX
        path: |
          **/*.msix*
