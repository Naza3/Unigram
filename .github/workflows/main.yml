name: Build Unigram Stable

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: windows-2022

    env:
      VCPKG_COMMIT: cff6ed45719c0162fa7065fdac90506a0add812c

    steps:

##########################################################
# Checkout (必须禁用recursive，否则VLC失败)
##########################################################

    - name: Checkout Unigram
      uses: actions/checkout@v4
      with:
        repository: UnigramDev/Unigram
        fetch-depth: 1
        submodules: false


##########################################################
# Init submodules（排除VLC）
##########################################################

    - name: Init submodules
      run: |

        git submodule update --init Libraries/rlottie
        git submodule update --init Libraries/opus
        git submodule update --init Libraries/usrsctp
        git submodule update --init Libraries/tgcalls


##########################################################
# VS tools
##########################################################

    - uses: microsoft/setup-msbuild@v2

    - uses: NuGet/setup-nuget@v2


##########################################################
# Constants.Secret.cs
##########################################################

    - name: Create Constants
      shell: powershell
      run: |

        mkdir Unigram\Telegram -Force

        @"
        namespace Telegram
        {
            public static partial class Constants
            {
                static Constants()
                {
                    ApiId = 123456;
                    ApiHash = "abcdef123456";
                    AppChannel = "ci";
                }
            }
        }
        "@ | Out-File Unigram\Telegram\Constants.Secret.cs -Encoding utf8


##########################################################
# vcpkg
##########################################################

    - name: Clone vcpkg
      run: git clone https://github.com/Microsoft/vcpkg.git


    - name: Bootstrap vcpkg
      shell: powershell
      run: |

        cd vcpkg

        git checkout $env:VCPKG_COMMIT

        .\bootstrap-vcpkg.bat


##########################################################
# ffmpeg patch（替代官方patch）
##########################################################

    - name: Patch ffmpeg
      shell: powershell
      run: |

        $file="vcpkg\ports\ffmpeg\portfile.cmake"

        (Get-Content $file) `
        -replace "--enable-libvpx",
        "--disable-everything --enable-protocol=file --enable-libopus --enable-libdav1d --enable-libvpx --enable-decoder=h264 --enable-decoder=hevc --enable-decoder=vp8 --enable-decoder=vp9 --enable-decoder=aac --enable-decoder=opus --enable-decoder=flac --enable-decoder=mp3 --enable-demuxer=matroska --enable-demuxer=mov --enable-demuxer=ogg --enable-demuxer=wav --enable-muxer=mp4" `
        | Set-Content $file


##########################################################
# Install libraries
##########################################################

    - name: Install vcpkg libs
      run: |

        vcpkg\vcpkg.exe install ffmpeg[dav1d,opus,vpx]:x64-uwp

        vcpkg\vcpkg.exe install lz4:x64-uwp
        vcpkg\vcpkg.exe install openssl:x64-uwp
        vcpkg\vcpkg.exe install zlib:x64-uwp
        vcpkg\vcpkg.exe install libogg:x64-uwp
        vcpkg\vcpkg.exe install opus:x64-uwp
        vcpkg\vcpkg.exe install boost-regex:x64-uwp

        vcpkg\vcpkg.exe integrate install


##########################################################
# TDLib (必须，否则链接失败)
##########################################################

    - name: Build TDLib
      shell: powershell
      run: |

        git clone https://github.com/tdlib/td.git

        cd td

        git clone https://github.com/Microsoft/vcpkg.git

        cd vcpkg

        git checkout $env:VCPKG_COMMIT

        .\bootstrap-vcpkg.bat

        .\vcpkg.exe install gperf:x86-windows
        .\vcpkg.exe install openssl:x64-uwp
        .\vcpkg.exe install zlib:x64-uwp

        cd ..

        cd example\uwp

        powershell -ExecutionPolicy ByPass ./build.ps1 `
          -vcpkg_root ../../vcpkg `
          -nupkg

        copy *.nupkg ..\..\Libraries\


##########################################################
# LibVLC build（官方方式）
##########################################################

    - name: Install Docker
      run: choco install docker-desktop -y


    - name: Start Docker
      run: net start com.docker.service


    - name: Build LibVLC
      shell: powershell
      run: |

        cd Libraries\vlc

        powershell -ExecutionPolicy ByPass ./build.ps1 -arch x64


##########################################################
# Restore NuGet
##########################################################

    - name: Restore
      run: nuget restore Telegram.sln


##########################################################
# Build
##########################################################

    - name: Build Solution
      run: |

        msbuild Telegram.sln ^
          /p:Configuration=Release ^
          /p:Platform=x64 ^
          /m


##########################################################
# Package
##########################################################

    - name: Package MSIX
      run: |

        msbuild Telegram.Msix/Telegram.Msix.wapproj ^
          /p:Configuration=Release ^
          /p:Platform=x64


##########################################################
# Upload
##########################################################

    - name: Upload MSIX
      uses: actions/upload-artifact@v4
      with:
        name: Unigram
        path: |
          **/*.msix*
